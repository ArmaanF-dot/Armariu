<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Main">
    <a class="brand" href="#/decisions">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M9 22 16 9l7 13"/></svg>
      <span>Armariu<br><small>Deal radar</small></span>

    <ul class="nav">
      <li><a href="#/decisions" data-view="decisions">Decisions <span class="count" id="nav-decisions"></span></a></li>

      <li><a href="#/lenders" data-view="lenders">Lenders</a></li>
      <li><a href="#/reports" data-view="reports">Reports and drafts</a></li>
      <li><a href="#/status" data-view="status">Status</a></li>

    <div class="sync" id="sync" role="status" aria-live="polite">
      <span class="dot"></span><span class="sync-text">Starting</span>
