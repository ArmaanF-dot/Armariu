<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="radar-token" content="__TOKEN__">
<title>Armariu review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141414'/%3E%3Cpath d='M8 23 16 9l8 14M11.5 17h9' stroke='white' stroke-width='2.6' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="mbar">
  <a class="mark" href="#/decisions" aria-label="Armariu deal radar"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M8 23 16 9l8 14M11.5 17h9"/></svg></a>
  <span class="mbar-title" id="mbar-title">Decisions</span>
  <button class="btn ghost" id="menu-open" aria-expanded="false" aria-controls="side">Menu</button>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Main">
    <div class="side-head">
      <a class="brand" href="#/decisions">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M8 23 16 9l8 14M11.5 17h9"/></svg>
        <span>Armariu<small>UK private credit radar</small></span>
      </a>
      <button class="btn ghost close-menu" id="menu-close" aria-label="Close menu">Close</button>
    </div>
    <p class="group">Review</p>
    <ul class="nav">
      <li><a href="#/decisions" data-view="decisions"><span>Decisions</span><span class="count" id="nav-decisions" aria-label="items waiting"></span></a></li>
      <li><a href="#/reports" data-view="reports">Reports and drafts</a></li>
    </ul>
    <p class="group">Register</p>
    <ul class="nav">
      <li><a href="#/charges" data-view="charges">Charges</a></li>
      <li><a href="#/lenders" data-view="lenders">Lenders</a></li>
    </ul>
    <div class="side-foot">
      <a class="nav-status" href="#/status" data-view="status">Status</a>
      <div class="sync" id="sync" role="status" aria-live="polite"><span class="dot"></span><span class="sync-text">Starting</span></div>
    </div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-inner" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <button class="btn ghost close" id="drawer-close">Close</button>
    <div id="drawer-body"></div>
  </div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
