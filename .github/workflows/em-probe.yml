# One-off research job for the emerging-markets data scoping (thread "Scope emerging markets for Alex pitch").
# Runs only on pushes to its own branch. Safe to delete once the scoping is done.
name: em-probe
on:
  push:
    branches: [claude/project-thread-b0ani2]
    paths: [".github/workflows/em-probe.yml", "armariu-radar/scripts/em_probe/**"]
permissions:
  contents: write
concurrency:
  group: em-probe
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: armariu-radar
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-b0ani2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run
        run: |
          pip install --quiet pandas
          bash scripts/em_probe/run.sh
      - name: Save results to this branch
        if: ${{ !cancelled() }}
        run: |
          git config user.name "armariu-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f em_probe_out
          git commit -q -m "em-probe: results from run ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
