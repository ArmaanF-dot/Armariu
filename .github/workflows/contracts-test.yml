# One-off research job for the contract-wins test (thread "Test contract wins as a lending signal").
# Runs only on pushes to its own branch. Safe to delete once the test is done.
name: contracts-test
on:
  push:
    branches: [claude/project-thread-8r1ade]
    paths: [".github/workflows/contracts-test.yml", "armariu-radar/scripts/contracts_test/**"]
permissions:
  contents: write
concurrency:
  group: contracts-test
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: armariu-radar
    env:
      CH_REST_KEY: ${{ secrets.CH_REST_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-8r1ade
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --quiet -r requirements.txt
          git config user.name "armariu-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run
        run: bash scripts/contracts_test/run.sh
      - name: Save results to this branch
        if: ${{ !cancelled() }}
        run: |
          git add -f contracts_test_out
          git commit -q -m "contracts-test: results from run ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
