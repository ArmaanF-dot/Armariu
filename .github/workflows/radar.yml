# Runs the Armariu deal radar on GitHub's servers, so your PC can be off.
#   1. Downloads the database from the 'radar-data' branch
#   2. Runs the pipeline (Companies House stream + company lookups, no AI). With time and quota left
#      over, it also fetches older charge histories for a random sample of companies
#      (radar/backfill.py), saved on its own 'radar-backfill' branch. Off switch: RADAR_BACKFILL "0".
#      Extra minutes per run for that alone: repository variable BACKFILL_EXTRA_MINUTES (default 0).
#   3. Saves the database back and commits the queue and weekly digests
#   4. Runs the Claude agents that have work, on your Claude plan (CLAUDE_CODE_OAUTH_TOKEN):
#      classifier, verifier (second opinion, Sonnet, about once a day), referee (Opus, only when
#      the first two disagree), reviewer, newsletter. An agent with nothing to do uses no Claude.
#
# Needs three repository secrets: CH_REST_KEY, CH_STREAM_KEY, CLAUDE_CODE_OAUTH_TOKEN.
# Run it by hand from the Actions tab: "radar" -> "Run workflow".
name: radar

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours at :23 (UTC). Change to */2 once you have GitHub Pro.
  workflow_dispatch:
    inputs:
      stream_minutes:
        description: "Minutes to listen to the Companies House stream"
        default: "2"
      backfill_minutes:
        description: "Extra minutes for the older-data backfill (blank = BACKFILL_EXTRA_MINUTES or 0)"
        default: ""
      run_agents:
        description: "Run the Claude agents after the pipeline"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: armariu-radar
    env:
      CH_REST_KEY: ${{ secrets.CH_REST_KEY }}
      CH_STREAM_KEY: ${{ secrets.CH_STREAM_KEY }}
      RADAR_STORE_RAW: "0"
      RADAR_BACKFILL: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The latest main when the job starts, not when it was queued: a run that waited behind
          # another one must build on what that run saved.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install --quiet -r requirements.txt
          git config user.name "armariu-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check secrets
        run: |
          missing=""
          [ -n "$CH_REST_KEY" ] || missing="$missing CH_REST_KEY"
          [ -n "$CH_STREAM_KEY" ] || missing="$missing CH_STREAM_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: Restore database
        # Exit code 1 means the branch doesn't exist yet (first run): start fresh. Anything else
        # (download failed, saved copy corrupt) stops the run, so a fresh empty database never
        # gets the chance to replace the real one. See armariu-radar/docs/backups.md.
        run: |
          for flag in "" "--backfill"; do
            rc=0; python -m radar.dbsync pull $flag || rc=$?
            if [ "$rc" -eq 1 ]; then echo "Starting fresh ($flag)";
            elif [ "$rc" -ne 0 ]; then exit "$rc"; fi
          done

      - name: Back up the saved database
        # Copies what is on radar-data / radar-backfill now into a dated release asset, unless it is
        # already there (normally the end of the previous run did it), so the copy this run is about
        # to replace is never the only one. A failure here only warns: missing a run loses stream data.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m radar.dbbackup save || echo "::warning::Backup before the run failed (see above)"
          python -m radar.dbbackup save --backfill || echo "::warning::Backfill backup before the run failed"

      - name: Pipeline
        run: python -m radar.pipeline run --minutes "${{ inputs.stream_minutes || '2' }}" --enrich-limit 2000 --rest-minutes 12 --backfill-minutes "${{ inputs.backfill_minutes || vars.BACKFILL_EXTRA_MINUTES || '0' }}"

      - name: Save database
        # dbsync refuses to overwrite the saved copy with a database that fails the integrity check
        # or has lost a big share of its rows (the step then fails and GitHub emails you). To save a
        # smaller database on purpose, set the repository variable RADAR_ALLOW_SHRINK to 1 for one run.
        if: ${{ !cancelled() }}
        env:
          RADAR_ALLOW_SHRINK: ${{ vars.RADAR_ALLOW_SHRINK || '0' }}
        run: |
          status=0
          if [ -f data/radar.db ]; then python -m radar.dbsync push || status=1; fi
          if [ -f data/backfill.db ]; then python -m radar.dbsync push --backfill || status=1; fi
          exit $status

      - name: Commit queue and digests
        if: ${{ !cancelled() }}
        run: |
          for f in classify/queue.jsonl classify/second_queue.jsonl classify/referee_queue.jsonl output/weekly; do
            [ -e "$f" ] && git add -- "$f"
          done
          if ! git diff --cached --quiet; then
            git commit --quiet -m "pipeline: update queue and digests"
            # These files are regenerated in full by every run, so if another run saved a version in
            # the meantime, keep this (newer) one. -X theirs = this run's commit during a rebase.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs --quiet && git push --quiet && break
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $attempt failed, retrying"; sleep 10
            done
          fi

      - name: Check which agents have work
        id: work
        if: ${{ github.event_name == 'schedule' || inputs.run_agents }}
        run: |
          agents=""
          for a in classifier verifier referee reviewer newsletter; do
            if python -m radar.agentcheck prepare "$a"; then agents="$agents $a"; fi
          done
          echo "Agents with work:${agents:- none}"
          echo "agents=$agents" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: ${{ steps.work.outputs.agents != '' }}
        run: npm install -g @anthropic-ai/claude-code --silent

      - name: Run agents
        if: ${{ steps.work.outputs.agents != '' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Missing secret CLAUDE_CODE_OAUTH_TOKEN (run 'claude setup-token' on your PC)"
            exit 1
          fi
          status=0
          for a in ${{ steps.work.outputs.agents }}; do
            echo "::group::$a"
            bash scripts/run_agent.sh "$a" || { echo "::warning::$a agent failed, see the logs artifact"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Back up the new database
        # Dated copy of what this run saved. Last, so a backup problem never blocks the agents; it
        # still fails the run, so GitHub emails you.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          python -m radar.dbbackup save || status=1
          python -m radar.dbbackup save --backfill || status=1
          exit $status

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: armariu-radar/logs/
          retention-days: 14
          if-no-files-found: ignore
