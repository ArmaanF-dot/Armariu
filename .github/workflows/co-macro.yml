# One-off research job: Colombian insolvency counts vs Colombian ADRs (thread "Assess Colombian data in armariu").
# Runs only on pushes to its own branch. Safe to delete once the study is done.
name: co-macro
on:
  push:
    branches: [claude/project-thread-nn8mr6]
    paths: [".github/workflows/co-macro.yml", "armariu-radar/scripts/em_probe/co_macro.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: armariu-radar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-nn8mr6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        run: |
          pip install --quiet pandas numpy
          python scripts/em_probe/co_macro.py em_probe_out 2>&1 | tee em_probe_out/co_macro_log.txt
      - name: Save results to this branch
        if: ${{ !cancelled() }}
        run: |
          git config user.name "armariu-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f em_probe_out/co_macro*
          git commit -q -m "co-macro: results from run ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
