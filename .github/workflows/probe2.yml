# One-off: look at what the Gazette and datos.gov.co actually return, so the petition and Colombia
# tests (plan tasks 13 and 14) can be written against real data. Run by hand: Actions -> "probe2".
# Prints short samples to the job log. No secrets, no repo writes.
name: probe2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Samples
        run: |
          show() { echo "=== $1"; curl -sS -m 60 -A "Mozilla/5.0 (research probe)" "$2" 2>&1 | head -c "$3"; echo; }
          B="https://www.thegazette.co.uk"
          B="https://www.thegazette.co.uk"
          show "A notice 4897752 json (linked data)" "$B/notice/4897752/data.json?view=linked-data" 2500
          show "B notice 4897752 xml" "$B/notice/4897752/data.xml" 2500
          show "C notice 4897752 html text" "$B/notice/4897752" 100
          curl -sS -m 60 -A "Mozilla/5.0" "$B/notice/4897752" | grep -io -m5 "company number[^<]\{0,40\}" || echo "no company number in html"
