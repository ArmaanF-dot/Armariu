# One-off diagnostic for the Gazette per-notice lookups (plan task 13). Prints timings and status codes to the job log.
name: probe2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Timings
        run: |
          B="https://www.thegazette.co.uk"
          echo "=== 12 sequential lookups"
          for id in 4897752 4900672 4892828 4897000 4898000 4899000 4890000 4891000 4895000 4896000 4901000 4902000; do
            curl -sS -m 60 -o /tmp/o -w "%{http_code} %{time_total}s size=%{size_download}\n" -A "Mozilla/5.0" "$B/notice/$id/data.json?view=linked-data"
            grep -o '"companyNumber":"[^"]*"' /tmp/o | head -1
          done
          echo "=== 12 parallel lookups"
          seq 4903000 4903011 | xargs -P 12 -I{} curl -sS -m 60 -o /dev/null -w "%{http_code} %{time_total}s\n" -A "Mozilla/5.0" "$B/notice/{}/data.json?view=linked-data"
          echo "=== ttl variant (smaller?)"
          curl -sS -m 60 -o /tmp/t -w "%{http_code} %{time_total}s size=%{size_download}\n" -A "Mozilla/5.0" "$B/notice/4897752/data.ttl"
          grep -io "companyNumber[^;.]*" /tmp/t | head -2
