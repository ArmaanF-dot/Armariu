# One-off: look at what the Gazette and datos.gov.co actually return, so the petition and Colombia
# tests (plan tasks 13 and 14) can be written against real data. Run by hand: Actions -> "probe2".
# Prints short samples to the job log. No secrets, no repo writes.
name: probe2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Samples
        run: |
          show() { echo "=== $1"; curl -sS -m 60 -A "Mozilla/5.0 (research probe)" "$2" 2>&1 | head -c "$3"; echo; }
          B="https://www.thegazette.co.uk"
          show "A insolvency json, no filters" "$B/insolvency/notice/data.json?results-page-size=2" 3000
          show "B insolvency json, one day" "$B/insolvency/notice/data.json?results-page-size=2&start-publish-date=2024-06-03&end-publish-date=2024-06-07" 3000
          show "C all-notices, petition type code 2441" "$B/all-notices/notice/data.json?noticetype=2441&results-page-size=2&start-publish-date=2024-06-03&end-publish-date=2024-06-07" 3000
          show "D insolvency, text petition, 2024 week" "$B/insolvency/notice/data.json?text=petition&results-page-size=2&start-publish-date=2024-06-03&end-publish-date=2024-06-07" 3000
          show "E insolvency notice types page" "$B/insolvency/notice" 1500
