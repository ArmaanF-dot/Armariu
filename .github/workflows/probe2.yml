# One-off diagnostic: does the Gazette search find notices by company number, and how fast? (plan task 13)
name: probe2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Search by company number
        run: |
          B="https://www.thegazette.co.uk/insolvency/notice/data.json"
          echo "=== known petition company 11796457 (notice 4900672)"
          curl -sS -m 60 -A "Mozilla/5.0" "$B?text=11796457&start-publish-date=2021-10-01&results-page-size=5" -o /tmp/o -w "%{http_code} %{time_total}s\n"
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/o"))
          print("total", d.get("f:total"))
          for e in d.get("entry", [])[:5] if isinstance(d.get("entry"), list) else [d.get("entry")]:
              print(e.get("f:notice-code"), e.get("published"), e.get("title"))
          PY
          echo "=== 40 sequential searches by number (rate check)"
          ok=0; bad=0
          for n in 14324165 02673059 06840843 11796457 SC761413 10605023 11919519 SC077619 NC000103 12345678 \
                   00000086 00000100 00000200 00000300 00000400 00000500 00000600 00000700 00000800 00000900 \
                   01000001 01000002 01000003 01000004 01000005 01000006 01000007 01000008 01000009 01000010 \
                   02000001 02000002 02000003 02000004 02000005 02000006 02000007 02000008 02000009 02000010; do
            code=$(curl -sS -m 30 -A "Mozilla/5.0" -o /tmp/p -w "%{http_code}" "$B?text=$n&start-publish-date=2021-10-01&results-page-size=100")
            tot=$(python3 -c "import json;print(json.load(open('/tmp/p')).get('f:total'))" 2>/dev/null || echo "?")
            echo "$n $code total=$tot"
            sleep 0.3
          done
